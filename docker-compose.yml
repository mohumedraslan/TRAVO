version: '3.8'

services:
  frontend:
    build:
      context: ./trovaweb
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: always

  backend:
    build:
      context: ./travo/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      # Add other environment variables here
    volumes:
      - ./travo/backend/data:/app/data
      - ./travo/backend/travo.db:/app/travo.db
    restart: always
