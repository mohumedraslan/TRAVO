
name: Deploy to Huawei Cloud

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGION_ID: ap-southeast-3
  SWR_ORG: ${{ secrets.SWR_ORG }} # e.g., travo
  SWR_SERVER: swr.ap-southeast-3.myhuaweicloud.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to Huawei Cloud SWR
      uses: docker/login-action@v2
      with:
        registry: ${{ env.SWR_SERVER }}
        username: ${{ secrets.SWR_USERNAME }}
        password: ${{ secrets.SWR_PASSWORD }}

    - name: Build and Push Frontend
      run: |
        docker build -t $SWR_SERVER/$SWR_ORG/trovaweb:${{ github.sha }} ./trovaweb
        docker tag $SWR_SERVER/$SWR_ORG/trovaweb:${{ github.sha }} $SWR_SERVER/$SWR_ORG/trovaweb:latest
        docker push $SWR_SERVER/$SWR_ORG/trovaweb:${{ github.sha }}
        docker push $SWR_SERVER/$SWR_ORG/trovaweb:latest

    - name: Build and Push Backend
      run: |
        docker build -t $SWR_SERVER/$SWR_ORG/travo-backend:${{ github.sha }} ./travo/backend
        docker tag $SWR_SERVER/$SWR_ORG/travo-backend:${{ github.sha }} $SWR_SERVER/$SWR_ORG/travo-backend:latest
        docker push $SWR_SERVER/$SWR_ORG/travo-backend:${{ github.sha }}
        docker push $SWR_SERVER/$SWR_ORG/travo-backend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to ECS
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.ECS_HOST }}
        username: ${{ secrets.ECS_USER }}
        password: ${{ secrets.ECS_PASSWORD }}
        # key: ${{ secrets.ECS_KEY }}
        script: |
          # Install Docker if not present
          if ! command -v docker &> /dev/null; then
              echo "Docker not found. Installing..."
              curl -fsSL https://get.docker.com -o get-docker.sh
              sh get-docker.sh
          fi
          
          # Install Docker Compose Plugin (for 'docker compose' command) if not present
          if ! docker compose version &> /dev/null; then
              echo "Docker Compose Plugin not found. Installing..."
              sudo apt-get update
              sudo apt-get install docker-compose-plugin -y
          fi

          # Login to SWR on the server
          docker login -u ${{ secrets.SWR_USERNAME }} -p ${{ secrets.SWR_PASSWORD }} ${{ env.SWR_SERVER }}
          
          # Create directory if not exists
          mkdir -p ~/travo/data
          cd ~/travo
          
          # Create docker-compose.yml (or pull from git if you prefer)
          # Here we overwrite it with the latest version to ensure config updates
          cat <<EOF > docker-compose.yml
          services:
            frontend:
              image: ${{ env.SWR_SERVER }}/${{ secrets.SWR_ORG }}/trovaweb:latest
              ports:
                - "3000:3000"
              environment:
                - NEXT_PUBLIC_API_URL=http://backend:8000
              depends_on:
                - backend
              restart: always
              networks:
                - app-network
            backend:
              image: ${{ env.SWR_SERVER }}/${{ secrets.SWR_ORG }}/travo-backend:latest
              ports:
                - "8000:8000"
              environment:
                # Use absolute path for SQLite file in the mounted volume
                - DATABASE_URL=sqlite:////app/data/travo.db
                - SECRET_KEY=${{ secrets.SECRET_KEY }}
              volumes:
                # Persist data directory
                - ./data:/app/data
              restart: always
              networks:
                - app-network

          networks:
            app-network:
              driver: bridge
          EOF
          
          # Pull and restart
          docker compose pull
          docker compose up -d
