name: Deploy to Huawei Cloud

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGION_ID: ap-southeast-3
  SWR_ORG: ${{ secrets.SWR_ORG }}
  SWR_SERVER: swr.ap-southeast-3.myhuaweicloud.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to Huawei Cloud SWR
      uses: docker/login-action@v2
      with:
        registry: ${{ env.SWR_SERVER }}
        username: ${{ secrets.SWR_USERNAME }}
        password: ${{ secrets.SWR_PASSWORD }}

    - name: Build and Push Frontend
      run: |
        IMAGE_SHA=$SWR_SERVER/$SWR_ORG/trovaweb:${{ github.sha }}
        IMAGE_LATEST=$SWR_SERVER/$SWR_ORG/trovaweb:latest

        docker build -t $IMAGE_SHA ./trovaweb
        docker tag $IMAGE_SHA $IMAGE_LATEST
        docker push $IMAGE_SHA
        docker push $IMAGE_LATEST

    - name: Build and Push Backend
      run: |
        IMAGE_SHA=$SWR_SERVER/$SWR_ORG/travo-backend:${{ github.sha }}
        IMAGE_LATEST=$SWR_SERVER/$SWR_ORG/travo-backend:latest

        docker build -t $IMAGE_SHA ./travo/backend
        docker tag $IMAGE_SHA $IMAGE_LATEST
        docker push $IMAGE_SHA
        docker push $IMAGE_LATEST

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to ECS
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.ECS_HOST }}
        username: ${{ secrets.ECS_USER }}
        password: ${{ secrets.ECS_PASSWORD }}
        script: |
          # Install Docker if missing
          if ! command -v docker &>/dev/null; then
              curl -fsSL https://get.docker.com -o get-docker.sh
              sh get-docker.sh
          fi

          # Install Docker Compose if missing
          if ! docker compose version &>/dev/null; then
              sudo apt-get update
              sudo apt-get install -y docker-compose-plugin
          fi

          # Login to SWR
          docker login -u ${{ secrets.SWR_USERNAME }} -p ${{ secrets.SWR_PASSWORD }} ${{ env.SWR_SERVER }}

          mkdir -p ~/travo
          cd ~/travo

          cat <<EOF > docker-compose.yml
          services:
            frontend:
              image: ${{ env.SWR_SERVER }}/${{ secrets.SWR_ORG }}/trovaweb:latest
              ports:
                - "3000:3000"
              environment:
                NEXT_PUBLIC_API_URL: "http://backend:8000"
              depends_on:
                - backend
              restart: always
              networks:
                - app-network

            backend:
              image: ${{ env.SWR_SERVER }}/${{ secrets.SWR_ORG }}/travo-backend:latest
              ports:
                - "8000:8000"
              environment:
                DATABASE_URL: "${{ secrets.DATABASE_URL }}"
                SECRET_KEY: "${{ secrets.SECRET_KEY }}"
              volumes:
                - ./data:/app/data
              restart: always
              networks:
                - app-network

          networks:
            app-network:
          EOF

          docker compose pull
          docker compose up -d
